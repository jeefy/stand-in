version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 3.12-slim -> 3.13-slim is a runtime upgrade, not a refresh: move it
      # together with the classifiers, [tool.pyright] and the CI matrix.
      # Digest updates for 3.12-slim are still proposed.
      - dependency-name: "*python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
