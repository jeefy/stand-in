[project]
name = "stand-in"
version = "0.2.0"
description = "Reversible secret redaction for LLM traffic, as an Envoy ext_proc"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeffrey Sica" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "protobuf>=6.33.5,<7",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jeefy/stand-in"
Source = "https://github.com/jeefy/stand-in"
Issues = "https://github.com/jeefy/stand-in/issues"

[project.scripts]
standin = "standin.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standin"]

# patterns.yaml lives at the repository root; ship it inside the package so
# standin.patterns finds it next to the module in an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"patterns.yaml" = "standin/patterns.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "scripts/",
    "examples/",
    "patterns.yaml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated protobuf/gRPC stubs (scripts/gen-proto.sh) are not linted.
extend-exclude = ["src/standin/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
# Generated protobuf stubs; imports still resolve through their .pyi files.
exclude = ["src/standin/_proto"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# yaml resolves to pyright's bundled types-PyYAML stubs.
reportMissingModuleSource = false

[tool.coverage.run]
source = ["standin"]
omit = ["src/standin/_proto/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
